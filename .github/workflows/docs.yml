name: Docs

# API reference, generated from the doc comments rather than maintained by hand.
#
# Hand-written reference documentation goes stale the first time somebody is in
# a hurry. These pages come from the same comments a reader sees on hover in
# their editor, so the two cannot disagree.
#
# typedoc.json sets treatValidationWarningsAsErrors, so an exported symbol
# without a doc comment fails this build. That is deliberate: undocumented is
# how a public API becomes guesswork.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Generate the API reference
        run: npm run docs

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
