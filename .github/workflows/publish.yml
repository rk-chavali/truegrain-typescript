name: Publish

# Publishing uses npm's OIDC trusted publishing, so there is no npm token in
# this repository and none in an organisation secret. npm verifies a
# short-lived token GitHub mints for this workflow in this repository, which
# means a leaked secret cannot be used to publish because there is no secret.
#
# It also attaches a provenance attestation, so anyone installing the package
# can verify which commit and which workflow produced the tarball.
#
# Setting it up, once, on npmjs.com:
#   Package settings -> Publishing access -> Require two-factor authentication
#     or an automation token, then add a trusted publisher:
#       Organization or user: rk-chavali
#       Repository:           truegrain-typescript
#       Workflow:             publish.yml
#       Environment:          npm
#
# For the very first publish, before the package exists, publish once from your
# machine with `npm publish --access public`, then add the trusted publisher.
#
# Two things below are load bearing and both fail in the same confusing way,
# with the registry answering 404 to a publish of a package that plainly
# exists: the npm upgrade, and the absence of registry-url. See their comments.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # The OIDC token npm verifies, and what provenance is signed with.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # registry-url is deliberately absent. Given it, setup-node writes an
      # .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`, and with no such
      # secret set that expands to its own placeholder. npm then sends a
      # credential that is a literal string of X characters, and the registry
      # answers a publish with 404 rather than admitting the package exists.
      # Trusted publishing needs no .npmrc at all.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Node 22 bundles npm 10, which can sign a provenance statement but
      # cannot authenticate with OIDC: that arrived in npm 11.5.1. Without it
      # the job does the signing, publishes to the transparency log, and only
      # then fails on the upload, which reads like a permissions problem and
      # is not one. Pinned rather than @latest so a publish is reproducible.
      - name: Use an npm that can authenticate with OIDC
        run: npm install -g npm@11.19.1

      - run: npm ci

      # The tests run again here rather than trusting the CI run on the commit.
      # A release is built from a tag, and a tag can point anywhere.
      - name: Test before publishing
        run: |
          npm run typecheck
          npm test

      - name: Check the version matches the tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tag" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $declared"
            echo "a package whose version disagrees with its tag cannot be traced back to a commit"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
